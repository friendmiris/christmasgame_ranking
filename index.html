<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크리스마스 명예의 전당</title>
<meta name="theme-color" content="#0a1433">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎄%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd86b;--red:#e63946;--green:#2fbf71;--ice:#cdeeff;--acc:#ff4d5a;--acc2:#ffd86b}
body[data-zone="rudolph"]{--acc:#ff4d5a;--acc2:#ffd86b;--glow:255,90,70}
body[data-zone="snow"]{--acc:#4fc3ff;--acc2:#e8f8ff;--glow:90,200,255}
html,body{height:100%}
body{font-family:'Jua',sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;
 background:linear-gradient(180deg,#050b24 0%,#0c1c4a 38%,#1a3a78 70%,#2b5a98 100%) fixed}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}
.moon{position:fixed;top:9%;right:9%;width:clamp(70px,10vw,130px);aspect-ratio:1;border-radius:50%;z-index:0;
 background:radial-gradient(circle at 35% 35%,#fffdf0,#fff3c4 55%,#f2dc98);
 box-shadow:0 0 40px 14px rgba(255,244,200,.55),0 0 120px 50px rgba(255,235,170,.25);animation:moonp 6s ease-in-out infinite alternate}
@keyframes moonp{to{box-shadow:0 0 60px 20px rgba(255,244,200,.7),0 0 160px 70px rgba(255,235,170,.32)}}
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0}
.aurora i{position:absolute;left:-10%;width:120%;height:34%;filter:blur(38px);opacity:.5;mix-blend-mode:screen;transition:background 1.2s;will-change:transform}
.aurora i:nth-child(1){top:2%;background:linear-gradient(90deg,transparent,rgba(47,230,140,.7),rgba(90,160,255,.6),transparent);animation:au1 11s ease-in-out infinite alternate}
.aurora i:nth-child(2){top:10%;background:linear-gradient(90deg,transparent,rgba(var(--glow),.55),rgba(255,120,200,.45),transparent);animation:au2 14s ease-in-out infinite alternate}
@keyframes au1{from{transform:translateX(-6%) skewX(-8deg)}to{transform:translateX(6%) skewX(8deg);opacity:.75}}
@keyframes au2{from{transform:translateX(7%) skewX(10deg);opacity:.35}to{transform:translateX(-7%) skewX(-6deg);opacity:.65}}
#scene{position:fixed;left:0;bottom:0;width:100%;height:50vh;z-index:1;pointer-events:none}
.orn{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.starp{animation:starp 2s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
@keyframes starp{to{transform:scale(1.35);filter:drop-shadow(0 0 10px #ffe27a)}}
/* lights */
.lights{position:relative;z-index:3;display:flex;justify-content:space-around;height:50px;overflow:hidden}
.lights::before{content:"";position:absolute;left:-2%;right:-2%;top:6px;height:3px;background:#05140f;border-radius:50%}
.bulb{width:14px;height:22px;border-radius:50% 50% 55% 55%;margin-top:9px;position:relative;animation:blink 1.5s infinite}
.bulb::before{content:"";position:absolute;top:-5px;left:3px;width:8px;height:7px;background:#222;border-radius:2px}
@keyframes blink{0%,100%{opacity:1;filter:brightness(1.5)}50%{opacity:.3;filter:brightness(.6)}}
header{position:relative;z-index:3;text-align:center;padding:14px 16px 0}
h1{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:clamp(32px,6.4vw,72px);letter-spacing:2px;line-height:1.1;
 background:linear-gradient(100deg,#fff7c9 0%,#ffd86b 30%,#fff 50%,#ffd86b 70%,#e6a21e 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 16px rgba(255,200,80,.7)) drop-shadow(0 4px 0 rgba(120,50,0,.55));
 animation:sheen 4s linear infinite}
@keyframes sheen{to{background-position:-250% 0}}
.crown{display:inline-block;animation:bob 2.2s ease-in-out infinite;-webkit-text-fill-color:initial}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.sub{margin-top:4px;color:var(--ice);font-size:clamp(13px,1.8vw,19px)}
/* tabs */
nav{position:relative;z-index:3;display:flex;gap:14px;justify-content:center;padding:14px 12px 0}
.tab{font-family:inherit;font-size:clamp(17px,2.6vw,26px);color:#fff;border:2px solid rgba(255,255,255,.28);
 background:rgba(255,255,255,.1);backdrop-filter:blur(8px);padding:12px 28px;border-radius:999px;cursor:pointer;transition:.3s}
.tab:hover{transform:translateY(-3px)}
.tab.on{border-color:var(--acc2);transform:scale(1.08);
 background:linear-gradient(135deg,var(--acc),rgba(var(--glow),.55));box-shadow:0 0 30px rgba(var(--glow),.85),inset 0 0 12px rgba(255,255,255,.3)}
/* hero */
main{position:relative;z-index:3;max-width:1060px;margin:0 auto;padding:8px 14px 130px}
.zonehead{text-align:center;margin-top:14px}
.zonehead .zt{font-family:'Black Han Sans';font-size:clamp(30px,5.4vw,56px);color:#fff;
 text-shadow:0 0 18px rgba(var(--glow),.95),0 0 40px rgba(var(--glow),.6),0 3px 0 rgba(0,0,0,.4);animation:zpop .7s cubic-bezier(.2,1.5,.4,1)}
.zonehead .zs{color:#fff3c9;font-size:clamp(14px,2vw,20px);margin-top:2px}
@keyframes zpop{from{transform:scale(.5);opacity:0}}
.hero{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2.4fr) minmax(120px,1fr);gap:8px;align-items:end;margin-top:8px}
.mascot{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:230px}
.mascot::before{content:"";position:absolute;inset:6% -10% 0;background:radial-gradient(closest-side,rgba(var(--glow),.45),transparent 75%);animation:aura 3s ease-in-out infinite alternate}
@keyframes aura{to{transform:scale(1.15);opacity:.65}}
.mascot svg{position:relative;width:100%;max-width:230px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));animation:mascin .9s cubic-bezier(.2,1.4,.4,1)}
.mascot.r svg{transform:scaleX(-1)}
@keyframes mascin{from{transform:translateY(60px) scale(.6);opacity:0}}
.mascot.r svg{animation:none}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;min-height:260px}
.pod{text-align:center;position:relative;opacity:0;transform:translateY(40px);animation:rise .8s cubic-bezier(.2,1.3,.4,1) forwards}
.pod .who{font-size:clamp(15px,2.6vw,27px);word-break:keep-all;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.pod .pt{font-size:clamp(13px,2vw,20px);color:var(--ice);margin-bottom:6px}
.pod .medal{font-size:clamp(30px,6vw,58px);display:block;animation:bob 2.4s ease-in-out infinite}
.p1 .medal::after{content:"✨";position:absolute;margin-left:4px;animation:tw 1s infinite}
.pod .base{border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;
 font-family:'Black Han Sans';font-size:clamp(26px,5vw,48px);position:relative;overflow:hidden;color:rgba(0,0,0,.55)}
.pod .base::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.p1 .base{height:150px;background:linear-gradient(180deg,#ffe68a,#d99a14);box-shadow:0 0 40px rgba(255,210,90,.85)}
.p2 .base{height:108px;background:linear-gradient(180deg,#f1f4f8,#98a6b8);box-shadow:0 0 24px rgba(200,220,255,.5)}
.p3 .base{height:80px;background:linear-gradient(180deg,#f0b37a,#a8622a);box-shadow:0 0 24px rgba(240,160,100,.45)}
.p1{animation-delay:.5s}.p2{animation-delay:.2s}.p3{animation-delay:0s}
@keyframes rise{to{opacity:1;transform:none}}
.empty-slot .who{opacity:.4;font-size:clamp(12px,1.8vw,18px)}
/* list */
.board{display:flex;flex-direction:column;gap:9px;margin-top:20px;max-width:760px;margin-left:auto;margin-right:auto}
.row{display:grid;grid-template-columns:50px 1fr auto auto;gap:10px;align-items:center;padding:12px 18px;border-radius:18px;
 background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.25);opacity:0;transform:translateX(-50px);animation:slide .55s ease forwards}
@keyframes slide{to{opacity:1;transform:none}}
.row .rk{font-family:'Black Han Sans';font-size:23px;color:var(--gold);text-align:center}
.row .nm{font-size:clamp(16px,2.6vw,24px);word-break:keep-all}
.row .sc{font-size:clamp(17px,2.6vw,26px);color:#fff7c9;text-shadow:0 0 10px rgba(255,210,90,.7)}
.row .sc small{font-size:.65em;color:var(--ice);margin-left:2px}
.row.fresh{animation:slide .55s ease forwards,flash 1.4s ease 3;border-color:var(--gold)}
@keyframes flash{50%{box-shadow:0 0 34px 6px rgba(255,216,107,.95);background:rgba(255,216,107,.28)}}
.del{display:none;font-family:inherit;border:0;border-radius:10px;padding:6px 10px;background:#7a1f2a;color:#fff;cursor:pointer;font-size:13px}
body.admin .del{display:inline-block}
.emptymsg{text-align:center;color:#fff;padding:26px 10px;font-size:clamp(16px,2.4vw,22px);line-height:1.8;text-shadow:0 2px 8px rgba(0,0,0,.6)}
/* buttons */
.fab{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btn{font-family:inherit;font-size:18px;color:#fff;border:0;border-radius:999px;padding:14px 24px;cursor:pointer;
 background:linear-gradient(135deg,var(--green),#1b8a50);box-shadow:0 6px 22px rgba(47,191,113,.55);transition:.2s}
.btn:hover{transform:translateY(-2px) scale(1.04)}
.btn.big{font-size:clamp(18px,2.6vw,24px);padding:16px 30px;background:linear-gradient(135deg,var(--red),#a81c29);box-shadow:0 6px 26px rgba(230,57,70,.65);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 6px 44px rgba(255,100,100,1)}}
.mini{font-family:inherit;font-size:13px;color:#cfe;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;cursor:pointer}
.mini.on{background:rgba(47,191,113,.5)}
.status{position:fixed;left:12px;bottom:10px;z-index:20;font-size:12px;color:#355;background:rgba(255,255,255,.7);padding:3px 9px;border-radius:99px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,10,30,.75);backdrop-filter:blur(6px);padding:16px}
.modal.show{display:flex}
.card{width:min(460px,100%);padding:26px;border-radius:24px;background:linear-gradient(160deg,#1b3a73,#0f2149);border:2px solid var(--gold);
 box-shadow:0 0 50px rgba(255,216,107,.4);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{font-weight:400;font-size:26px;color:var(--gold);margin-bottom:14px;text-align:center}
label{display:block;font-size:15px;color:var(--ice);margin:12px 0 5px}
input,select{width:100%;font-family:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;outline:none}
select option{color:#111}
input:focus,select:focus{border-color:var(--gold)}
.acts{display:flex;gap:10px;margin-top:20px}
.acts .btn{flex:1;padding:13px}
.acts .btn.gray{background:#3a4a6e;box-shadow:none}
.err{color:#ff9aa2;font-size:14px;min-height:18px;margin-top:8px;text-align:center}
.banner{position:fixed;left:50%;top:38%;z-index:70;transform:translate(-50%,-50%) scale(0);text-align:center;pointer-events:none;width:92%}
.banner.go{animation:ban 4.2s cubic-bezier(.2,1.4,.4,1) forwards}
.banner .t1{font-size:clamp(20px,4vw,34px);color:#fff;text-shadow:0 2px 10px #000}
.banner .t2{font-family:'Black Han Sans';font-size:clamp(40px,10vw,110px);line-height:1.1;
 background:linear-gradient(180deg,#fff,#ffd86b 60%,#e6a21e);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 24px rgba(255,200,60,.95)) drop-shadow(0 5px 0 rgba(120,50,0,.6))}
.banner .t3{font-size:clamp(18px,3.4vw,30px);color:var(--ice);margin-top:6px;text-shadow:0 2px 10px #000}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg)}12%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}20%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
/* v3 */
.mini.quiet{opacity:.3;font-size:12px;padding:5px 10px;transition:.25s}
.mini.quiet:hover,.mini.quiet:focus,.mini.quiet.on{opacity:1}
.card.wide{width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column}
.admlist{overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.arow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:16px}
.arow .t{font-size:12px;color:#9fc6e8}.arow .s{color:#fff3c0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-family:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--gold)}
#admCount{font-size:16px;color:var(--ice)}
/* beams & sleigh */
.beam{position:fixed;top:0;width:260px;height:75vh;z-index:2;pointer-events:none;mix-blend-mode:screen;transform-origin:50% 0;
 background:linear-gradient(180deg,rgba(255,244,190,.38),rgba(255,244,190,0) 85%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.7}
.b1{left:20%;animation:bsw 7s ease-in-out infinite alternate}.b2{left:62%;animation:bsw 9s ease-in-out -3s infinite alternate-reverse}
@keyframes bsw{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.sleigh{position:fixed;top:11vh;left:-30vw;width:clamp(170px,24vw,340px);z-index:1;pointer-events:none;filter:drop-shadow(0 0 12px rgba(255,220,120,.7));animation:fly 46s linear 4s infinite}
@keyframes fly{0%{transform:translate(0,24px) rotate(3deg)}10%{transform:translate(28vw,-14px) rotate(-3deg)}20%{transform:translate(58vw,20px) rotate(3deg)}30%{transform:translate(88vw,-10px) rotate(-3deg)}40%,100%{transform:translate(150vw,10px) rotate(2deg)}}
.sl-nose{filter:drop-shadow(0 0 6px #ff2a3a);animation:tw .8s infinite}
/* podium v3 */
.podium{min-height:300px;gap:14px}
.pod{isolation:isolate}
.medalsvg{display:block;margin:0 auto 2px;width:clamp(54px,9vw,92px);height:auto;filter:drop-shadow(0 0 14px rgba(255,215,90,.85));animation:medin .9s cubic-bezier(.2,1.6,.4,1) both}
.p1 .medalsvg{width:clamp(76px,13vw,132px);filter:drop-shadow(0 0 26px rgba(255,220,100,1))}
.p2 .medalsvg{filter:drop-shadow(0 0 16px rgba(210,225,255,.9))}.p3 .medalsvg{filter:drop-shadow(0 0 16px rgba(255,170,100,.85))}
@keyframes medin{from{transform:scale(0) rotate(-200deg)}}
.swing{transform-origin:50px 0;animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.tws{animation:tw 1.1s infinite;transform-origin:center;transform-box:fill-box}
.pod .medal{display:none}
.crownF{font-size:clamp(30px,5.4vw,56px);line-height:1;margin-bottom:-6px;filter:drop-shadow(0 0 16px #ffd23f);animation:bob 2s ease-in-out infinite}
.rays{position:absolute;left:50%;top:-30px;width:min(420px,60vw);aspect-ratio:1;margin-left:calc(min(420px,60vw)/-2);border-radius:50%;z-index:-1;
 background:repeating-conic-gradient(rgba(255,226,120,.5) 0 7deg,transparent 7deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pod .who{font-size:clamp(16px,2.8vw,30px);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 3.5s linear infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.p1 .who{font-size:clamp(20px,3.8vw,40px);background-image:linear-gradient(100deg,#ffe27a,#fff,#ffc933,#fff6c4,#ffe27a)}
.p2 .who{background-image:linear-gradient(100deg,#c9d6e8,#fff,#a9b8cf,#fff,#c9d6e8)}
.p3 .who{background-image:linear-gradient(100deg,#ffb77a,#ffe2c4,#d98a4e,#ffe2c4,#ffb77a)}
.empty-slot .who{background-image:none;color:rgba(255,255,255,.45);-webkit-text-fill-color:currentColor;animation:none}
.empty-slot .medalsvg{opacity:.28;filter:grayscale(1)}
.pod .pt{font-size:clamp(15px,2.4vw,24px);color:#fff7c9;text-shadow:0 0 12px rgba(255,220,120,.8)}
.pod .base{font-size:clamp(26px,5vw,52px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 20px rgba(255,255,255,.8);align-items:center;padding-top:0;
 box-shadow:inset 0 5px 0 rgba(255,255,255,.7),inset 0 -12px 22px rgba(0,0,0,.28),0 0 40px var(--bg1);position:relative}
.pod .base::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.9) 0 1.4px,transparent 2px) 0 0/26px 26px,radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.8px) 13px 13px/26px 26px;animation:tw 1.3s infinite alternate;opacity:.55}
.p1{--bg1:rgba(255,215,80,.95)}.p2{--bg1:rgba(200,220,255,.6)}.p3{--bg1:rgba(255,160,90,.55)}
.p1 .base{height:176px}.p2 .base{height:124px}.p3 .base{height:92px}
.p1 .base span,.p2 .base span,.p3 .base span{position:relative;z-index:1}
@media(max-width:700px){.podium{min-height:260px;gap:8px}.p1 .base{height:140px}.p2 .base{height:100px}.p3 .base{height:74px}.beam{width:160px}}
.row2{display:flex;gap:6px}
.zb.on{opacity:.85}
.cel{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;
 background:radial-gradient(circle at 50% 45%,rgba(10,20,60,.3) 0,rgba(3,6,22,.84) 80%);animation:celin .4s ease both}
.cel.out{animation:celout .7s ease forwards}
@keyframes celin{from{opacity:0}}@keyframes celout{to{opacity:0;transform:scale(1.08)}}
.cel.r1{--c1:#fff3b0;--c2:#ffc933;--c3:#c98a00;--rc:255,216,90}
.cel.r2{--c1:#ffffff;--c2:#cfd9e6;--c3:#7d8a9c;--rc:200,220,255}
.cel.r3{--c1:#ffe2c4;--c2:#e69a5a;--c3:#8a4a1c;--rc:255,170,100}
.cel.r0{--c1:#c8ffd8;--c2:#4de08f;--c3:#1b8a50;--rc:100,230,150}
.cflash{position:absolute;inset:0;background:#fff;animation:cflash .9s ease-out forwards;pointer-events:none}
@keyframes cflash{from{opacity:.95}to{opacity:0}}
.crays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;
 background:repeating-conic-gradient(rgba(var(--rc),.24) 0 6deg,transparent 6deg 15deg);
 -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 22s linear infinite}
.crings i{position:absolute;left:50%;top:44%;width:30px;height:30px;margin:-15px;border-radius:50%;border:4px solid rgba(var(--rc),.9);box-shadow:0 0 30px rgba(var(--rc),.9);animation:ring 2.2s ease-out infinite;opacity:0;pointer-events:none}
.crings i:nth-child(2){animation-delay:.7s}.crings i:nth-child(3){animation-delay:1.4s}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(50);opacity:0}}
.cbody{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 12px}
.ctop{font-size:clamp(18px,3.6vw,34px);color:#fff;text-shadow:0 0 16px rgba(var(--rc),1),0 2px 8px #000;animation:celdrop .7s cubic-bezier(.2,1.5,.4,1) .15s both}

/* ---------- 저장 ---------- */
function loadLocal(){ try{ const a=JSON.parse(localStorage.getItem(LS)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(records)); }catch(e){} }
function setStatus(t){ $('status').textContent = t; }
const CFG=window.XMAS_CFG||{}; let SB=null, adminPw=''; const seen=new Set();
const mapRow=r=>({id:r.id,game:r.game,name:r.name,score:Number(r.score),ts:Date.parse(r.created_at)});
const sigOf=l=>l.map(r=>r.id+':'+r.score).sort().join('|');
async function loadAll(){ const {data,error}=await SB.from('records').select('*').order('created_at',{ascending:true}).limit(2000); if(error) throw error; return data.map(mapRow).filter(r=>GAMES[r.game]); }
async function syncAll(force){
  try{ const list=await loadAll(); list.forEach(r=>seen.add(r.id)); if(force||sigOf(list)!==sigOf(records)){ records=list; saveLocal(); render(); } return true; }catch(e){ return false; }
}
async function initRemote(){
  if(!CFG.url||!CFG.key||!window.supabase){ setStatus('💾 이 기기에만 저장 중 (서버 설정 없음)'); return; }
  SB=window.supabase.createClient(CFG.url,CFG.key); setStatus('⏳ 서버 연결 중…');
  if(!(await syncAll(true))) setStatus('⚠️ 서버 연결 실패 — 이 기기에만 저장 중');
  SB.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},payload=>{
    if(payload.eventType==='INSERT'){
      const r=mapRow(payload.new); if(!GAMES[r.game]||seen.has(r.id)) return; seen.add(r.id); records.push(r); saveLocal();
      cur=r.game; freshId=r.id; render(); const pos=ranked(r.game).findIndex(x=>x.id===r.id)+1;
      celebrate(pos,r.name,r.game,r.score,r); setTimeout(()=>{ freshId=null; },6000);
    } else syncAll(true);
  }).subscribe(st=>{
    if(st==='SUBSCRIBED'){ setStatus('☁️ 실시간 연동 중 (모든 기기에 바로 반영)'); syncAll(false); }
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED') setStatus('⚠️ 연결이 끊겼어요 — 다시 연결 중…');
  });
  setInterval(()=>{ if(!document.hidden) syncAll(false); },30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncAll(false); });
}
function addRecord(game,name,score){
  const id=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():'00000000-0000-4000-8000-'+Date.now().toString(16).padStart(12,'0');
  const rec={id,game,name,score,ts:Date.now()}; records.push(rec); seen.add(id); saveLocal();
  if(SB) SB.from('records').insert({id,game,name,score}).then(({error})=>{ if(error){ records=records.filter(r=>r.id!==id); saveLocal(); render(); toast('⚠️ 서버 저장에 실패했어요. 다시 등록해 주세요'); } });
  return rec;
}
function removeRecord(id){
  records=records.filter(r=>r.id!==id); saveLocal();
  if(SB) SB.rpc('admin_delete_record',{p_id:id,p_pw:adminPw}).then(({data,error})=>{ if(error||data!==true){ toast('⚠️ 삭제에 실패했어요'); syncAll(true); } });
}
function ranked(g){
  return records.filter(r=>r.game===g).sort((x,y)=>(y.score-x.score)||(x.ts-y.ts));
}

      <div class="rk">${i+4}</div><div class="nm">${esc(r.name)}</div>
      <div class="sc">${fmt(r.score)}<small>${g.unit}</small></div></div>`).join('');

const R3=(a,b)=>a+Math.random()*(b-a), wait=ms=>new Promise(r=>setTimeout(r,ms));

function tick(f,v){ if(!soundOn||!AC) return; bell(f,AC.currentTime+.005,.2,v||.05); }
function thump(){ if(!soundOn||!AC) return; const c=AC,t=c.currentTime+.01,o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(45,t+.18);
  g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.connect(g); g.connect(master); o.start(t); o.stop(t+.3); jingle(t,.1); }

  }); g.globalAlpha=1;

    const rk=row.querySelector('.rk'), nm=row.querySelector('.nm'), sc=row.querySelector('.sc'); const mid=q=>q.top+q.height/2;

    if(sc){ const q=sc.getBoundingClientRect(); TX(g,sc.textContent,q.right,mid(q),fontOf(sc),'#fff7c9','right','rgba(255,210,90,.6)'); } }); g.globalAlpha=1;
  const em=Q('.emptymsg'); if(em){ const r=em.getBoundingClientRect(), L=em.innerText.split('\n'), fs=parseFloat(getComputedStyle(em).fontSize);
    L.forEach((ln,i)=>TX(g,ln,r.left+r.width/2,r.top+r.height/2+(i-(L.length-1)/2)*fs*1.7,fontOf(em),'#fff','center','rgba(0,0,0,.6)')); }
  g.drawImage(cv,0,0,W,H);
  const cel=Q('.cel');
  if(cel){
    const rc=RC[[...cel.classList].find(c=>RC[c])||'r0'], co=opOf(cel);
    if(co>0){
      g.globalAlpha=co; const vg=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.7); vg.addColorStop(0,'rgba(10,20,60,.3)'); vg.addColorStop(1,'rgba(3,6,22,.84)'); g.fillStyle=vg; g.fillRect(0,0,W,H);
      g.save(); g.translate(W/2,H/2); g.rotate(t*2*Math.PI/22); const R=Math.max(W,H), rg=g.createRadialGradient(0,0,0,0,0,R*.7); rg.addColorStop(0,`rgba(${rc},.24)`); rg.addColorStop(1,`rgba(${rc},0)`); g.fillStyle=rg;
      for(let i=0;i<24;i++){ const a0=i*Math.PI*2/24; g.beginPath(); g.moveTo(0,0); g.arc(0,0,R*.7,a0,a0+Math.PI*2/24*.4); g.closePath(); g.fill(); } g.restore();

function pickMime(){ for(const m of ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ''; }
async function recordScreen(){
  if(recBusy) return; const dur=recDur;
  const setBtn=t=>{ $('recBtn').textContent=t; $('recBtn').classList.toggle('on',recBusy); };
  recBusy=true; $('recGo').disabled=true; $('rpanel').classList.remove('show'); setBtn('⏳ 준비 중…');
  try{
    const dl=DL;
    if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream){ toast('이 기기·브라우저는 영상 녹화를 지원하지 않아요'); return; }
    try{ await document.fonts.ready; }catch(e){}
    const W=innerWidth, H=innerHeight, sc=Math.min(2,1280/Math.max(W,H)), outW=Math.max(2,Math.round(W*sc/2)*2), outH=Math.max(2,Math.round(H*sc/2)*2);
    const S={s:outW/W,W,H,medals:{}};
    const sceneEl=$('scene'), sr=sceneEl.getBoundingClientRect();
    S.scene=await svgImg(sceneEl,sr.width*S.s,sr.height*S.s);
    const slSvg=document.querySelector('.sleigh svg'); if(slSvg){ const r=slSvg.getBoundingClientRect(); S.sleigh=await svgImg(slSvg,r.width*S.s,r.height*S.s); }
    const mSvg=document.querySelector('#mascotL svg'); if(mSvg){ const [w,h]=cssSize(mSvg); S.mascot=await svgImg(mSvg,w*S.s,h*S.s); }
    for(const pod of document.querySelectorAll('.pod')){ const k=pod.classList.contains('p1')?'p1':pod.classList.contains('p2')?'p2':'p3', sv=pod.querySelector('.medalsvg'); if(sv){ const [w,h]=cssSize(sv); S.medals[k]=await svgImg(sv,w*S.s,h*S.s); } }
    const out=document.createElement('canvas'); out.width=outW; out.height=outH; const g=out.getContext('2d'); drawScreen(g,0,S);
    const stream=out.captureStream(30);
    if(soundOn&&ac()&&recDest){ try{ stream.addTrack(recDest.stream.getAudioTracks()[0]); }catch(e){} }
    const mime=pickMime(); let mr; try{ mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5000000}:undefined); }catch(e){ mr=new MediaRecorder(stream); }
    const chunks=[]; mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const done=new Promise(res=>{ mr.onstop=res; });
    mr.start(200); const t0=performance.now();
    await new Promise(res=>{ (function loop(){ const t=(performance.now()-t0)/1000; drawScreen(g,t,S); setBtn(`⏺ 녹화 중 ${Math.max(0,Math.ceil(dur-t))}초`);
      if(t<dur) requestAnimationFrame(loop); else res(); })(); });
    mr.stop(); await done; setBtn('💾 저장 중…');
    const type=mr.mimeType||mime||'video/webm', ext=type.includes('mp4')?'mp4':'webm', blob=new Blob(chunks,{type});
    if(!blob.size){ toast('영상 만들기에 실패했어요'); return; }
    const d=new Date(), pad2=n=>String(n).padStart(2,'0');
    await dl.save({filename:`명예의전당_${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.${ext}`,data:blob});
    toast('✅ 영상 저장 완료!');
  }catch(e){ if(!(e&&e.code==='declined')) toast('영상 저장에 실패했어요'+(e&&e.code?` (${e.code})`:'')); }
  finally{ recBusy=false; $('recGo').disabled=false; setBtn('🎬 영상 저장'); }
}
function setDur(v){ recDur=v; $('rDur').value=v; $('rDurN').textContent=v+'초'; try{ localStorage.setItem('xmas-recdur',v); }catch(e){}
  $('rChips').innerHTML=[3,5,10,15].map(x=>`<button type="button" class="chip ${x===v?'on':''}" data-v="${x}">${x}초</button>`).join('');
  $('rChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>setDur(+b.dataset.v)); }
$('rDur').oninput=()=>setDur(+$('rDur').value);
$('recBtn').onclick=()=>{ if(recBusy) return; $('mpanel').classList.remove('show'); $('rpanel').classList.toggle('show'); };
